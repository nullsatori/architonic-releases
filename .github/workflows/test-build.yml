name: Test build

# Пробные сборки Architonic Commander в публичном репозитории: здесь минуты
# GitHub Actions бесплатны, включая macOS. Исходники берутся из закрытого
# nullsatori/architonic-commander по токену COMMANDER_TOKEN (fine-grained,
# доступ только к этому репозиторию, Contents: Read-only).
# Логи и артефакты публичного репозитория видны всем, поэтому здесь только
# неподписанные пробные сборки, без ключей подписи и без релизов.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или коммит в architonic-commander"
        default: beta
        required: true
      targets:
        description: "Что собирать: mac, mac-intel, windows, android через запятую"
        default: mac,android
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      android: ${{ steps.m.outputs.android }}
    steps:
      - id: m
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          items=()
          [[ ",$TARGETS," == *",mac,"* ]] && items+=('{"name":"macos-arm64","os":"macos-latest","args":"--target aarch64-apple-darwin"}')
          [[ ",$TARGETS," == *",mac-intel,"* ]] && items+=('{"name":"macos-x64","os":"macos-latest","args":"--target x86_64-apple-darwin"}')
          [[ ",$TARGETS," == *",windows,"* ]] && items+=('{"name":"windows-x64","os":"windows-latest","args":""}')
          joined=$(IFS=,; echo "${items[*]}")
          echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          if [[ ",$TARGETS," == *",android,"* ]]; then echo "android=true"; else echo "android=false"; fi >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nullsatori/architonic-commander
          ref: ${{ inputs.ref }}
          token: ${{ secrets.COMMANDER_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: architonic-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg

  android:
    needs: plan
    if: ${{ needs.plan.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nullsatori/architonic-commander
          ref: ${{ inputs.ref }}
          token: ${{ secrets.COMMANDER_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npx tauri android init --ci

      - name: Camera permission
        run: |
          m=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q android.permission.CAMERA "$m" || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.CAMERA" />|' "$m"

      - run: npx tauri android build --debug --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: architonic-android-arm64
          retention-days: 7
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
